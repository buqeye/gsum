[project]
name = "gsum"
version = "0.4.0"
description = "A Bayesian model of series convergence using Gaussian sums"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "EFT",
    "nuclear",
    "model",
    "gaussian",
    "process",
    "uncertainty",
    "quantification",
    "buqeyemodel",
    "buqeye"
]
dependencies = [
    "docrep>=0.3.2",
    "matplotlib>=3.10.6",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]
license = { text = "MIT" }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
